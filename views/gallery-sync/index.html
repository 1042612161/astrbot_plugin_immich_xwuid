<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Immich 鸣潮图库同步</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--ink:#202534;--muted:#6b7280;--line:#e4e8f0;--accent:#5865d8;--soft:#edf0ff;--good:#15845b;--bad:#b54747}
    [data-theme=dark]{--bg:#151923;--card:#202633;--ink:#edf0f6;--muted:#a1a9b8;--line:#343d4d;--accent:#9ba6ff;--soft:#30364f;--good:#66d1a1;--bad:#ff9999}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px}
    main{max-width:1100px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:4px 0 24px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:26px;line-height:1.2;margin:6px 0}p{color:var(--muted);margin:6px 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #1b2a4510}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h2{font-size:17px;margin:0}.tag{padding:5px 10px;background:var(--soft);color:var(--accent);border-radius:99px;font-size:12px;font-weight:650}
    .table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px}th{font-size:12px;color:var(--muted);font-weight:600}select,input{width:100%;max-width:440px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}.role{font-weight:650}.specifications{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}.specifications label{display:grid;gap:7px;color:var(--muted)}
    button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}button.secondary{background:var(--soft);color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:9px}.sync-actions{align-items:flex-start;margin-top:16px}.sync-actions select{min-width:240px;max-width:340px}.notice{font-size:13px;min-height:22px;color:var(--muted);margin-top:13px;white-space:pre-wrap}.notice.error{color:var(--bad)}.notice.ok{color:var(--good)}.empty{padding:22px;text-align:center;color:var(--muted)}.hint{font-size:12px;margin-top:12px}
    @media(max-width:650px){body{padding:16px}.hero{display:block}.hero .actions{margin-top:14px}.card{padding:16px}.specifications{grid-template-columns:1fr}.section-head{gap:10px;flex-wrap:wrap}}
  </style>
</head>
<body><main>
  <header class="hero"><div><div class="eyebrow">Immich × XWUID</div><h1>鸣潮图库同步</h1><p>将 Immich 角色相册映射到 XWUID 面板图与背景图图库。</p></div>
    <div class="actions"><button class="secondary" id="refresh">刷新列表</button><button class="secondary" id="create">创建缺失角色相册</button><button id="save">保存设置与映射</button></div>
  </header>
  <section class="card" aria-labelledby="specification-title"><h2 id="specification-title">相册规格名称</h2><div class="specifications"><label for="panel-specification">面板图规格名称<input id="panel-specification" type="text" value="竖图" placeholder="例如：竖图" autocomplete="off"></label><label for="background-specification">背景图规格名称<input id="background-specification" type="text" value="横图" placeholder="例如：横图" autocomplete="off"></label></div><p class="hint">相册命名为「角色名-规格名称」。修改任一规格名称并保存，将清空两张映射表并重新自动匹配；已有相册不会重命名。</p></section>
  <section class="card"><div class="section-head"><h2>面板图映射</h2><span class="tag" id="panel-suffix">相册后缀「竖图」</span></div><div class="table-wrap"><table><thead><tr><th>XWUID 角色</th><th>Immich 相册</th></tr></thead><tbody id="panel"></tbody></table></div><div class="actions sync-actions"><select id="panel-sync-roles" multiple size="4" aria-label="选择要同步面板图的角色"></select><button id="panel-sync">同步所选角色面板图</button></div><div class="notice" id="panel-progress"></div></section>
  <section class="card"><div class="section-head"><h2>背景图映射</h2><span class="tag" id="background-suffix">相册后缀「横图」</span></div><div class="table-wrap"><table><thead><tr><th>XWUID 角色</th><th>Immich 相册</th></tr></thead><tbody id="background"></tbody></table></div><div class="actions sync-actions"><select id="background-sync-roles" multiple size="4" aria-label="选择要同步背景图的角色"></select><button id="background-sync">同步所选角色背景图</button></div><div class="notice" id="background-progress"></div></section>
  <p class="hint">角色与相册均来自站点现有列表。切换角色会交换两行的角色分配，并保留相册选择。创建缺失角色相册会按已保存的规格名称直接执行，并共享给当前所有 Immich 账号且授予编辑权限。</p>
  <div class="notice" id="notice" role="status"></div>
</main>
<script type="module" src="./app.js"></script>
</body></html>
